name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project folder
        run: |
          echo "---- repo files ----"
          find . -maxdepth 3 -not -path './.git*' | sort
          SG=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SG" ]; then
            echo "ERROR: settings.gradle not found - files were not uploaded correctly"
            exit 1
          fi
          DIR=$(dirname "$SG")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" PilgerCut.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PilgerCut-APK
          path: PilgerCut.apk
